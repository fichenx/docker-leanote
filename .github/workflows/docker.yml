name: build-and-push

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      version:
        description: '跟随 leanote Release 的版本号（如 2.6.1-hardened）'
        required: false
        default: '2.6.1-hardened'

permissions:
  contents: read

env:
  IMAGE: fichenx/leanote
  # 版本号跟随 GitHub Release；手动触发时可覆盖
  LEANOTE_VERSION: ${{ github.event.inputs.version || '2.6.1-hardened' }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        variant:
          - name: full
            dockerfile: Dockerfile
            platforms: linux/amd64,linux/arm64
          - name: nodb
            dockerfile: Dockerfile.nodb
            platforms: linux/amd64,linux/arm64
          - name: lite
            dockerfile: Dockerfile.lite
            platforms: linux/amd64,linux/arm64,linux/arm/v7
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Hub login
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ env.LEANOTE_VERSION }},enable=${{ matrix.variant.name == 'full' }}
            type=raw,value=${{ env.LEANOTE_VERSION }}-${{ matrix.variant.name }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.variant.dockerfile }}
          platforms: ${{ matrix.variant.platforms }}
          build-args: |
            LEANOTE_VERSION=${{ env.LEANOTE_VERSION }}
          push: ${{ env.DOCKERHUB_USERNAME != '' && github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant.name }}
